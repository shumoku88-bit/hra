name: Ada qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ada-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Alire and Ada toolchain
        uses: alire-project/setup-alire@v6

      - name: Rename legacy ALedger identity on migration PR
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/hra-namespace-rename'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def is_workflow(path: str) -> bool:
              return path.startswith('.github/workflows/')

          def new_path(path: str) -> str:
              if is_workflow(path):
                  return path
              if path == 'tools/al':
                  return 'tools/hra'
              for old, new in (
                  ('ADA_FOR_ALEDGER', 'ADA_FOR_HRA'),
                  ('ALedger', 'HRA'),
                  ('Aledger', 'HRA'),
                  ('ALEDGER', 'HRA'),
                  ('aledger', 'hra'),
              ):
                  path = path.replace(old, new)
              return path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          renames = [(path, new_path(path)) for path in tracked if new_path(path) != path]
          for old, new in sorted(renames, key=lambda pair: pair[0].count('/'), reverse=True):
              subprocess.check_call(['git', 'mv', old, new])

          replacements = (
              ('tools/al', 'tools/hra'),
              ('ALedger', 'HRA'),
              ('Aledger', 'HRA'),
              ('ALEDGER', 'HRA'),
              ('aledger', 'hra'),
          )
          legacy_tokens = tuple(old for old, _ in replacements)
          content_leftovers = []

          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if is_workflow(name):
                  continue
              path = Path(name)
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
              if any(token in updated for token in legacy_tokens):
                  content_leftovers.append(name)

          path_leftovers = []
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if is_workflow(name):
                  continue
              if any(token in name for token in ('aledger', 'ALedger', 'Aledger', 'ALEDGER')) or name == 'tools/al':
                  path_leftovers.append(name)

          if path_leftovers:
              raise SystemExit('legacy paths remain: ' + ', '.join(path_leftovers))
          if content_leftovers:
              raise SystemExit('legacy content remains: ' + ', '.join(content_leftovers))
          PY

          ./tools/hra qualify

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: rename ALedger namespace to HRA'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Build, test, and prove
        run: ./tools/hra qualify
