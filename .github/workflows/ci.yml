name: Ada qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ada-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Alire and Ada toolchain
        uses: alire-project/setup-alire@v6

      - name: Build, test, and prove
        shell: bash
        run: |
          log="$(mktemp)"
          if ./tools/hra qualify >"$log" 2>&1; then
            tail -n 120 "$log"
          else
            echo "::group::Qualification diagnostics"
            grep -E '(^|[[:space:]])(error:|ERROR:|FAIL|FAILED|failed|Compilation failed|gnatprove)' "$log" | tail -n 200 || true
            echo "::endgroup::"
            echo "::group::Qualification tail"
            tail -n 160 "$log"
            echo "::endgroup::"
            exit 1
          fi
