name: qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Build
        run: alr build

      - name: Test
        run: ./bin/test_runner

      - name: Prove
        run: ./tools/prove
