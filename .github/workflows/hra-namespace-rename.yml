name: HRA namespace rename

on:
  push:
    branches:
      - chore/hra-namespace-rename

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out rename branch
        uses: actions/checkout@v6
        with:
          ref: chore/hra-namespace-rename

      - name: Rename ALedger surfaces to HRA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = '.github/workflows/hra-namespace-rename.yml'

          def new_path(path: str) -> str:
              if path == 'tools/al':
                  return 'tools/hra'
              for old, new in (
                  ('ADA_FOR_ALEDGER', 'ADA_FOR_HRA'),
                  ('ALedger', 'HRA'),
                  ('Aledger', 'HRA'),
                  ('ALEDGER', 'HRA'),
                  ('aledger', 'hra'),
              ):
                  path = path.replace(old, new)
              return path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          renames = [(path, new_path(path)) for path in tracked if new_path(path) != path]
          for old, new in sorted(renames, key=lambda pair: pair[0].count('/'), reverse=True):
              subprocess.check_call(['git', 'mv', old, new])

          replacements = (
              ('tools/al', 'tools/hra'),
              ('ALedger', 'HRA'),
              ('Aledger', 'HRA'),
              ('ALEDGER', 'HRA'),
              ('aledger', 'hra'),
          )

          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if name == workflow:
                  continue
              path = Path(name)
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          leftovers = []
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if name == workflow:
                  continue
              if any(token in name for token in ('aledger', 'ALedger', 'Aledger', 'ALEDGER')) or name == 'tools/al':
                  leftovers.append(name)
          if leftovers:
              raise SystemExit('legacy paths remain: ' + ', '.join(leftovers))
          PY

      - name: Qualify renamed repository
        run: ./tools/hra qualify

      - name: Commit qualified rename
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'refactor: rename ALedger namespace to HRA'
          git push origin HEAD:chore/hra-namespace-rename
